<style>
:root{
  --bg:#050605;
  --bg2:#0a0c0a;
  --card:#0d120e;
  --card2:#151d16;
  --line:rgba(255,255,255,.08);
  --txt:#edefed;
  --muted:#8a978c;
  --accent:#4ade80;
  --accent2:#22c55e;
  --accent-glow:rgba(34,197,94,.35);
  --yellow:#f59e0b;
  --red:#ef4444;
  --blue:#3b82f6;
  --gold:#c9a24a;
  --gold-soft:rgba(201,162,74,.13);
  --radius:16px;
  --ease:cubic-bezier(.16,1,.3,1);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:16px;line-height:1.5;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;left:50%;top:-30vh;width:140vw;max-width:900px;height:70vh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(34,197,94,.13),rgba(34,197,94,.04) 55%,transparent);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100dvh;padding:0 calc(16px + var(--safe-r)) calc(40px + var(--safe-b)) calc(16px + var(--safe-l))}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:20;margin:0 calc(-16px - var(--safe-r)) 0 calc(-16px - var(--safe-l));padding:calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));display:flex;align-items:center;gap:10px;min-height:calc(60px + var(--safe-t));background:rgba(5,6,5,.74);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border-bottom:1px solid var(--line)}
.hdr-logo{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(201,162,74,.55)}
.hdr-t{min-width:0;flex:1}
.hdr-t small{display:block;font-size:12px;line-height:1.3;color:var(--muted);letter-spacing:.02em}
.hdr-t b{display:block;font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;min-width:44px;height:44px;display:inline-flex;align-items:center;gap:2px;margin-left:-8px;padding:0 10px 0 4px;border-radius:12px;color:var(--accent);font-weight:600;font-size:15px}
.back:active{background:rgba(74,222,128,.08)}
.logout{flex:none;height:44px;display:inline-flex;align-items:center;gap:6px;margin-right:-6px;padding:0 10px;border-radius:12px;font-weight:600;font-size:14px;color:var(--txt)}
.logout svg{color:var(--red)}
.logout:hover,.logout:active{background:rgba(239,68,68,.1)}

/* ---------- tipografia ---------- */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.display{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin-top:6px}
.display:focus{outline:none}
.lead{color:var(--muted);font-size:15px;margin-top:8px;max-width:40ch}
.sec-label{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 10px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-label span{font-variant-numeric:tabular-nums;letter-spacing:0}

/* ---------- gate ---------- */
.gate{padding-top:calc(44px + var(--safe-t));text-align:center}
.gate-logo{width:112px;height:112px;border-radius:50%;margin:0 auto 22px;display:block;box-shadow:0 0 0 1px rgba(201,162,74,.6),0 24px 60px -16px var(--accent-glow)}
.gate .lead{margin-left:auto;margin-right:auto}
.gate .list{text-align:left}

/* ---------- listas / cards ---------- */
.list{display:grid;gap:10px;margin-top:24px}
.card-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:68px;padding:12px 14px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.card-btn:hover{border-color:rgba(74,222,128,.28);background:var(--card2)}
.card-btn:active{background:var(--card2)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--accent);background:radial-gradient(circle at 30% 25%,rgba(74,222,128,.22),rgba(34,197,94,.05));box-shadow:inset 0 0 0 1px rgba(74,222,128,.28)}
.ci{flex:1;min-width:0}
.ci b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.ci span{display:block;font-size:13.5px;line-height:1.4;color:var(--muted);margin-top:2px}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;line-height:1;color:var(--gold);background:var(--gold-soft);padding:6px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.chev{flex:none;color:var(--muted)}

/* ---------- home do líder ---------- */
.hello{padding-top:26px}
.self{margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.self-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 4px;border-radius:12px;text-align:left;color:var(--muted)}
.self-btn:hover,.self-btn:active{color:var(--txt)}
.self-btn .ci b{font-size:15px;font-weight:500}
.self-btn .ci span{font-size:13px}
.self-ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px dashed rgba(255,255,255,.16)}

/* ---------- tela da função ---------- */
.role-hero{padding-top:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1;color:var(--txt);padding:8px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.chip svg{color:var(--accent)}
.chip.gold{color:var(--gold);background:var(--gold-soft);border-color:transparent;font-variant-numeric:tabular-nums}

.about{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.about summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;font-weight:600;font-size:15px;cursor:pointer}
.about summary::-webkit-details-marker{display:none}
.about summary .chev{margin-left:auto;transition:transform .3s var(--ease)}
.about[open] summary .chev{transform:rotate(180deg)}
.about p{padding:0 14px 16px;color:var(--muted);font-size:14.5px;line-height:1.6}

.inds{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ind{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 14px;text-align:left;font-size:15px;line-height:1.35}
.ind+.ind{border-top:1px solid var(--line)}
.ind .n{flex:none;width:26px;font-family:var(--serif);font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.ind .t{flex:1;min-width:0}
.ind .go{flex:none;color:var(--muted);opacity:.8}
button.ind:hover,button.ind:active{background:var(--card2)}

.search{position:relative;margin-top:4px}
.search input{width:100%;height:50px;padding:0 48px 0 44px;font:inherit;font-size:16px;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:14px;outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:rgba(74,222,128,.5);box-shadow:0 0 0 4px rgba(74,222,128,.12)}
.search input::-webkit-search-cancel-button{display:none}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clr{position:absolute;right:3px;top:3px;width:44px;height:44px;display:none;place-items:center;color:var(--muted);border-radius:12px}
.search.has .clr{display:grid}
.search-info{font-size:13px;color:var(--muted);margin:10px 2px 0;min-height:1em}

.accs{display:grid;gap:10px;margin-top:12px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);scroll-margin-top:calc(84px + var(--safe-t));transition:border-color .25s var(--ease)}
.acc.open{border-color:rgba(74,222,128,.22)}
.acc.flash{border-color:var(--gold)}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px;text-align:left}
.badge{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:var(--serif);font-size:16px;color:var(--gold);background:var(--gold-soft);font-variant-numeric:tabular-nums}
.badge.leaf{color:var(--accent);background:rgba(74,222,128,.08)}
.acc-h .ci b{font-size:15.5px;line-height:1.35}
.acc-h .ci span{font-size:13px}
.acc-h .chev{transition:transform .35s var(--ease)}
.acc.open .acc-h .chev{transform:rotate(180deg);color:var(--accent)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-in{overflow:hidden;min-height:0}
.crits{list-style:none;padding:2px 14px 14px 14px;display:grid;gap:2px}
.crit{display:flex;gap:12px;padding:9px 2px;font-size:15px;line-height:1.5;border-top:1px solid rgba(255,255,255,.05)}
.crit:first-child{border-top:0}
.crit svg{flex:none;margin-top:3px;color:var(--accent2)}
.grp-t{padding:14px 16px 4px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
mark{background:rgba(245,158,11,.22);color:#fde68a;border-radius:3px;padding:0 1px}

.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed rgba(255,255,255,.12);border-radius:var(--radius);font-size:15px}
.empty b{display:block;color:var(--txt);margin-bottom:4px}

.scale{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sc{display:flex;gap:14px;align-items:flex-start;padding:13px 14px}
.sc+.sc{border-top:1px solid var(--line)}
.sc .nt{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#0a0c0a;font-variant-numeric:tabular-nums}
.sc b{display:block;font-size:15px;font-weight:600}
.sc span{display:block;font-size:13.5px;color:var(--muted);line-height:1.45}

.foot{margin-top:36px;text-align:center;font-size:12px;color:var(--muted);opacity:.8}

/* ---------- PIN ---------- */
.pin{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));background:rgba(5,6,5,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.pin-box{width:100%;max-width:340px;text-align:center}
.pin-top{position:absolute;top:calc(8px + var(--safe-t));left:calc(8px + var(--safe-l))}
.pin .av{width:64px;height:64px;font-size:22px;margin:0 auto 14px}
.pin h2{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.15}
.pin-msg{margin-top:6px;min-height:22px;font-size:15px;color:var(--muted)}
.pin-msg.err{color:#fca5a5}
.dots{display:flex;justify-content:center;gap:18px;margin:26px 0 30px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.28);transition:background-color .15s,border-color .15s}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dots.err .dot{border-color:var(--red);background:var(--red)}
.dots.ok .dot{border-color:var(--accent);background:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(3,76px);justify-content:center;gap:16px 24px}
.key{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;background:var(--card2);border:1px solid var(--line);transition:background-color .12s}
.key:active{background:rgba(74,222,128,.18)}
.key.ghost{background:none;border-color:transparent;font-size:15px;font-weight:600;color:var(--muted)}
.key:disabled{opacity:.35;cursor:not-allowed}
@media (max-height:640px){.keys{gap:10px 22px}.key{width:66px;height:66px;font-size:24px}.dots{margin:18px 0 20px}}

/* ---------- aviso de instalação ---------- */
.install{position:fixed;z-index:50;left:50%;bottom:calc(12px + var(--safe-b));width:min(488px,calc(100% - 24px - var(--safe-l) - var(--safe-r)));transform:translateX(-50%);display:flex;gap:12px;align-items:flex-start;padding:14px 8px 14px 14px;background:rgba(21,29,22,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(74,222,128,.22);border-radius:18px;box-shadow:0 20px 50px -12px rgba(0,0,0,.7)}
.install img{width:40px;height:40px;border-radius:50%;flex:none}
.install .ci b{font-size:15px}
.install .ci span{font-size:13.5px}
.install .ci svg{display:inline-block;vertical-align:-3px;color:var(--accent)}
.install .x{flex:none;width:44px;height:44px;margin-top:-8px;display:grid;place-items:center;color:var(--muted);border-radius:12px}
.install .ok{margin-top:10px;height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;color:#052e12;background:linear-gradient(180deg,var(--accent),var(--accent2))}

body.hint #app{padding-bottom:calc(160px + var(--safe-b))}
@media (min-width:600px){.display{font-size:38px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

    user: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    leaf: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>',
    doc: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>',
    share: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
  };

  /* ---------------- acesso (PIN) ----------------
     PIN_HASH[id] = SHA-256 de "boiverde:<id>:<pin>". Líder sem hash entra direto.
     Proteção leve: evita entrar no perfil de outro líder por engano;
     não é segurança forte (o código do site é público). */
  const PIN_LEN = 4, MAX_ERROS = 5, BLOQUEIO_MS = 30000;
  const keyErros = id => "avaliacao_pin_erros_" + id;
  const keyBloq = id => "avaliacao_pin_bloqueio_" + id;

  async function sha256(txt) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function autorizarLider(id) {
    const hash = (window.PIN_HASH || {})[id];
    if (!hash) return Promise.resolve(true);
    return new Promise(resolve => abrirPin(LIDER[id], hash, resolve));
  }

  function abrirPin(l, hash, resolve) {
    const slot = document.getElementById("pin-slot");
    let pin = "", busy = false, timer = null;
    const prontoMsg = `Digite seu PIN de ${PIN_LEN} dígitos`;
    slot.innerHTML = `
      <div class="pin" role="dialog" aria-modal="true" aria-labelledby="pin-t">
        <div class="pin-top"><button class="back" data-cancel aria-label="Voltar">${I.chevL}<span>Voltar</span></button></div>
        <div class="pin-box">
          <span class="av" aria-hidden="true">${esc(initials(l.nome))}</span>
          <h2 id="pin-t">Olá, ${esc(l.nome)}</h2>
          <p class="pin-msg" aria-live="assertive">${prontoMsg}</p>
          <div class="dots" aria-hidden="true">${'<span class="dot"></span>'.repeat(PIN_LEN)}</div>
          <div class="keys">
            ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join("")}
            <button class="key ghost" data-cancel>Cancelar</button>
            <button class="key" data-k="0">0</button>
            <button class="key ghost" data-del aria-label="Apagar">${I.del}</button>
          </div>
        </div>
      </div>`;
    const box = slot.firstElementChild;
    const $dots = box.querySelector(".dots");
    const $msg = box.querySelector(".pin-msg");
    const $keys = box.querySelectorAll("[data-k], [data-del]");
    const g = G();
    if (g) g.fromTo(box.querySelector(".pin-box"), { scale: .85, opacity: 0 }, { scale: 1, opacity: 1, duration: .45, ease: "back.out(1.7)" });

    const paint = () => [...$dots.children].forEach((d, i) => d.classList.toggle("on", i < pin.length));
    const msg = (t, err) => { $msg.textContent = t; $msg.classList.toggle("err", !!err); };
    const lock = on => $keys.forEach(k => { k.disabled = on; });

    function bloqueado() {
      const ate = +store.get(keyBloq(l.id)) || 0;
      const falta = ate - Date.now();
      if (falta <= 0) {
        if (timer) { clearInterval(timer); timer = null; }
        if (ate) { store.del(keyBloq(l.id)); lock(false); msg(prontoMsg); }
        return false;
      }
      lock(true);
      msg(`Muitas tentativas. Tente de novo em ${Math.ceil(falta / 1000)} s`, true);
      if (!timer) timer = setInterval(bloqueado, 1000);
      return true;
    }

    function fechar(ok) {
      if (timer) clearInterval(timer);
      document.removeEventListener("keydown", onKey);
      const end = () => { slot.innerHTML = ""; resolve(ok); };
      if (g && !ok) g.to(box, { opacity: 0, duration: .18, ease: "power2.in", onComplete: end });
      else end();
    }

    async function confere() {
      busy = true;
      const certo = (await sha256(`boiverde:${l.id}:${pin}`)) === hash;
      if (certo) {
        store.del(keyErros(l.id));
        $dots.classList.add("ok");
        setTimeout(() => fechar(true), 180);
        return;
      }
      const erros = (+store.get(keyErros(l.id)) || 0) + 1;
      store.set(keyErros(l.id), erros);
      $dots.classList.add("err");
      if (navigator.vibrate) navigator.vibrate(90);
      if (g) g.fromTo($dots, { x: 0 }, { keyframes: { x: [-12, 12, -9, 9, -5, 5, 0] }, duration: .45, ease: "power1.out" });
      setTimeout(() => {
        $dots.classList.remove("err");
        pin = ""; paint(); busy = false;
        if (erros >= MAX_ERROS) {
          store.del(keyErros(l.id));
          store.set(keyBloq(l.id), Date.now() + BLOQUEIO_MS);
          bloqueado();
        } else {
          msg(`PIN incorreto. ${plural(MAX_ERROS - erros, "tentativa restante", "tentativas restantes")}`, true);
        }
      }, 480);
    }

    function digita(n) {
      if (busy || pin.length >= PIN_LEN || bloqueado()) return;
      pin += n; paint();
      const dot = $dots.children[pin.length - 1];
      if (g && dot) g.fromTo(dot, { scale: .6 }, { scale: 1, duration: .3, ease: "back.out(3)" });
      if (pin.length === PIN_LEN) confere();
    }
    function apaga() { if (!busy && pin) { pin = pin.slice(0, -1); paint(); } }
    function onKey(e) {
      if (/^[0-9]$/.test(e.key)) digita(e.key);
      else if (e.key === "Backspace") apaga();
      else if (e.key === "Escape") fechar(false);
    }

    box.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => digita(b.dataset.k)));
    box.querySelector("[data-del]").addEventListener("click", apaga);
    box.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => fechar(false)));
    document.addEventListener("keydown", onKey);
    bloqueado();
    box.querySelector("h2").setAttribute("tabindex", "-1");
    box.querySelector("h2").focus({ preventScroll: true });
  }

  function sair() {
    store.del(KEY_LIDER);
    depth = 0;
    history.replaceState(null, "", "#/");
    render();
  }

  const liderAtual = () => { const id = store.get(KEY_LIDER); return id && LIDER[id] ? LIDER[id] : null; };

  /* ---------------- animações ---------------- */
  function enter(stagger) {
    const g = G(); if (!g) return;
    g.fromTo($app.children, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .35, ease: "power2.out", clearProps: "transform,opacity" });
    if (stagger) {
      const items = $app.querySelectorAll(stagger);
      if (items.length) g.from(items, { opacity: 0, y: 14, duration: .4, stagger: .05, ease: "power2.out", delay: .08, clearProps: "transform,opacity" });
    }
  }
  function pop(el) {
    const g = G(); if (!g || !el) return;
    g.fromTo(el, { scale: .92 }, { scale: 1, duration: .45, ease: "back.out(3)", clearProps: "transform" });
  }
  function staggerIn(list) {
    const g = G(); if (!g || !list.length) return;
    const opts = list.length > 12 ? { amount: .45 } : { each: .04 };
    g.from(list, { opacity: 0, y: 14, duration: .3, stagger: opts, ease: "power2.out", clearProps: "transform,opacity" });
  }

  /* ---------------- navegação ---------------- */
  const scrollMem = {};
  let forward = false, depth = 0;
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  function go(hash, delay) {
    const run = () => { forward = true; depth++; location.hash = hash; };
    delay ? setTimeout(run, delay) : run();
  }
  window.addEventListener("hashchange", () => { render(); });
  window.addEventListener("scroll", () => { scrollMem[location.hash || "#/"] = scrollY; }, { passive: true });

  function render() {
    const lider = liderAtual();
    const h = location.hash || "#/";
    const restore = !forward && scrollMem[h] != null;
    forward = false;

    if (h === "#/trocar") { store.del(KEY_LIDER); history.replaceState(null, "", "#/"); return render(); }
    if (!lider) { viewGate(); }
    else if (h.startsWith("#/f/")) {
      const id = decodeURIComponent(h.slice(4));
      const permitido = lider.liderados.includes(id) || lider.self === id;
      if (!ROLE[id] || !permitido) { history.replaceState(null, "", "#/equipe"); return render(); }
      viewRole(ROLE[id], lider);
    } else { viewHome(lider); }

    window.scrollTo(0, restore ? scrollMem[h] : 0);
    const h1 = $app.querySelector("h1");
    if (h1) h1.focus({ preventScroll: true });
  }

  /* ---------------- tela: quem é você ---------------- */
  function viewGate() {
    document.title = "Quem é você? · Critérios de Avaliação";
    $app.innerHTML = `
      <section class="gate">
        <img class="gate-logo" src="icons/logo.webp" width="112" height="112" alt="Fazenda Boi Verde">
        <p class="eyebrow">Critérios de avaliação</p>
        <h1 class="display" tabindex="-1">Quem é você?</h1>
        <p class="lead">Escolha seu nome para ver os indicadores e critérios da sua equipe.</p>
        <div class="list" role="list">
          ${LIDERES.map(l => `
            <button class="card-btn" role="listitem" data-lider="${l.id}">
              <span class="av" aria-hidden="true">${esc(initials(l.nome))}</span>
              <span class="ci"><b>${esc(l.nome)}</b><span>${esc(l.cargo)}</span></span>
              <span class="pill" aria-label="${plural(l.liderados.length, "liderado", "liderados")}">${I.users}${l.liderados.length}</span>
              ${I.chevR}
            </button>`).join("")}
        </div>
      </section>`;
    $app.querySelectorAll("[data-lider]").forEach(b => b.addEventListener("click", () => {
      pop(b);
      const id = b.dataset.lider;
      autorizarLider(id).then(ok => {
        if (!ok) return;
        store.set(KEY_LIDER, id);
        go("#/equipe", G() ? 160 : 0);
      });
    }));
    enter(".card-btn");
  }

  /* ---------------- tela: equipe do líder ---------------- */
  function header(inner) {
    return `<header class="hdr">${inner}</header>`;
  }
  function viewHome(l) {
    document.title = `Equipe de ${l.nome} · Critérios de Avaliação`;
    const equipe = l.liderados.map(id => ROLE[id]).sort((a, b) => roleTitle(a).localeCompare(roleTitle(b), "pt"));
    const self = l.self && ROLE[l.self];
    $app.innerHTML = `
      ${header(`
        <img class="hdr-logo" src="icons/logo.webp" width="36" height="36" alt="">
        <div class="hdr-t"><small>Fazenda Boi Verde</small><b>Critérios de Avaliação</b></div>
        <button class="logout" data-logout>${I.logout}<span>Sair</span></button>`)}
      <section class="hello">
        <p class="eyebrow">${esc(l.cargo)}</p>
        <h1 class="display" tabindex="-1">Olá, ${esc(l.nome)}</h1>
        <p class="lead">Toque em um colaborador para ver os indicadores e critérios cobrados na avaliação.</p>
      </section>
      <h2 class="sec-label">Minha equipe <span>${equipe.length}</span></h2>
      <div class="list" role="list" style="margin-top:0">
        ${equipe.map(r => {
          const outros = r.lideres.filter(x => x !== l.id).map(x => LIDER[x].nome);
          const sub = [r.pessoa ? r.funcao : null, outros.length ? `Também com ${outros.join(", ")}` : null].filter(Boolean).join(" · ");
          return `
          <button class="card-btn" role="listitem" data-role="${r.id}">
            <span class="av" aria-hidden="true">${esc(initials(roleTitle(r)))}</span>
            <span class="ci"><b>${esc(roleTitle(r))}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</span>
            ${I.chevR}
          </button>`;
        }).join("")}
      </div>
      ${self ? `
      <div class="self">
        <button class="self-btn" data-role="${self.id}">
          <span class="self-ic" aria-hidden="true">${I.doc}</span>
          <span class="ci"><b>Minha avaliação</b><span>${esc(self.funcao)}</span></span>
          ${I.chevR}
        </button>
      </div>` : ""}
      <p class="foot">Fazenda Boi Verde · Documento de referência</p>`;
    $app.querySelectorAll("[data-role]").forEach(b => b.addEventListener("click", () => {
      pop(b);
      go("#/f/" + b.dataset.role, G() ? 140 : 0);
    }));
    $app.querySelector("[data-logout]").addEventListener("click", sair);
    enter(".list .card-btn");
    maybeInstallHint();
  }

  /* ---------------- tela: função ---------------- */
  function viewRole(r, l) {
    const mine = l.self === r.id;
    document.title = `${roleTitle(r)} · Critérios de Avaliação`;
    const linked = new Map(r.secoes.map((s, i) => [s.ind, i]).filter(([k]) => k));
    const lideres = r.lideres.map(x => LIDER[x].nome);

    $app.innerHTML = `
      ${header(`
        <button class="back" data-back aria-label="Voltar">${I.chevL}<span>Voltar</span></button>
        <div class="hdr-t"><small>${mine ? "Minha avaliação" : "Equipe de " + esc(l.nome)}</small><b>${esc(roleTitle(r))}</b></div>`)}
      <section class="role-hero">
        <p class="eyebrow">${mine ? "Minha avaliação" : esc(r.pessoa ? r.funcao : "Função")}</p>
        <h1 class="display" tabindex="-1">${esc(roleTitle(r))}</h1>
        <div class="chips">
          <span class="chip">${I.user}${lideres.length > 1 ? "Líderes" : "Líder"}: ${esc(lideres.join(", "))}</span>
          <span class="chip gold">10 indicadores · ${critCount(r)} critérios</span>
        </div>
        <details class="about">
          <summary>Sobre esta avaliação ${I.chevD}</summary>
          <p>${esc(r.apresentacao)}</p>
        </details>
      </section>

      <h2 class="sec-label">Indicadores avaliados <span>10</span></h2>
      <div class="inds">
        ${r.indicadores.map((nome, i) => {
          const n = i + 1, has = linked.has(n);
          const inner = `<span class="n">${pad(n)}</span><span class="t">${esc(nome)}</span>`;
          return has
            ? `<button class="ind" data-goto="${linked.get(n)}" aria-label="${esc(nome)}: ver critérios">${inner}${I.down}</button>`
            : `<div class="ind">${inner}</div>`;
        }).join("")}
      </div>

      <h2 class="sec-label">Critérios</h2>
      <div class="search" role="search">
        <label class="sr" for="q">Buscar critério</label>
        ${I.search}
        <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="Buscar critério…">
        <button class="clr" type="button" aria-label="Limpar busca">${I.x}</button>
      </div>
      <p class="search-info" id="qinfo" aria-live="polite"></p>
      <div class="accs" id="accs"></div>

      <h2 class="sec-label">Escala de pontuação</h2>
      <div class="scale">
        ${ESCALA.map(e => `
          <div class="sc">
            <span class="nt" style="background:${["", "var(--red)", "#f97316", "var(--yellow)", "#86efac", "var(--accent)"][e.nota]}">${e.nota}</span>
            <div><b>${esc(e.classe)}</b><span>${esc(e.ref)}</span></div>
          </div>`).join("")}
      </div>
      <p class="foot">Fazenda Boi Verde · Documento de referência</p>`;

    const $accs = document.getElementById("accs");
    const $q = document.getElementById("q");
    const $qinfo = document.getElementById("qinfo");
    const $search = $q.parentElement;
    const open = new Set();

    const hl = (text, q) => {
      if (!q) return esc(text);
      const f = fold(text);
      let out = "", i = 0, k;
      while ((k = f.indexOf(q, i)) !== -1) {
        out += esc(text.slice(i, k)) + "<mark>" + esc(text.slice(k, k + q.length)) + "</mark>";
        i = k + q.length;
      }
      return out + esc(text.slice(i));
    };
    const li = (t, q) => `<li class="crit">${I.check}<span>${hl(t, q)}</span></li>`;

    function drawSections(q) {
      let shown = 0, hits = 0;
      const html = r.secoes.map((s, idx) => {
        let itens = s.itens, grupos = s.grupos || [];
        if (q) {
          const titleHit = fold(s.titulo).includes(q);
          if (!titleHit) {
            itens = itens.filter(t => fold(t).includes(q));
            grupos = grupos.map(g => fold(g.titulo).includes(q) ? g : { titulo: g.titulo, itens: g.itens.filter(t => fold(t).includes(q)) }).filter(g => g.itens.length);
          }
          const n = itens.length + grupos.reduce((m, g) => m + g.itens.length, 0);
          if (!n) return "";
          hits += n;
        }
        shown++;
        const total = itens.length + grupos.reduce((m, g) => m + g.itens.length, 0);
        const isOpen = q ? true : open.has(idx);
        return `
          <section class="acc${isOpen ? " open" : ""}" id="sec-${idx}" data-idx="${idx}">
            <button class="acc-h" aria-expanded="${isOpen}" aria-controls="secb-${idx}">
              <span class="badge${s.ind ? "" : " leaf"}" aria-hidden="true">${s.ind ? pad(s.ind) : I.leaf}</span>
              <span class="ci"><b>${hl(s.titulo, q)}</b><span>${plural(total, "critério", "critérios")}</span></span>
              ${I.chevD}
            </button>
            <div class="acc-b" id="secb-${idx}" role="region"${isOpen ? "" : " inert"}>
              <div class="acc-in">
                <ul class="crits">${itens.map(t => li(t, q)).join("")}</ul>
                ${grupos.map(g => `<p class="grp-t">${hl(g.titulo, q)}</p><ul class="crits">${g.itens.map(t => li(t, q)).join("")}</ul>`).join("")}
              </div>
            </div>
          </section>`;
      }).join("");

      $accs.innerHTML = html || `<div class="empty"><b>Nenhum critério encontrado</b>Tente outra palavra, como “limpeza”, “prazo” ou “líder”.</div>`;
      $qinfo.textContent = q ? (hits ? `${plural(hits, "critério encontrado", "critérios encontrados")} em ${plural(shown, "seção", "seções")}` : "") : "";
      $accs.querySelectorAll(".acc-h").forEach(btn => btn.addEventListener("click", () => toggle(btn.parentElement)));
    }

    function toggle(sec, force) {
      const idx = +sec.dataset.idx;
      const willOpen = force != null ? force : !sec.classList.contains("open");
      sec.classList.toggle("open", willOpen);
      sec.querySelector(".acc-h").setAttribute("aria-expanded", willOpen);
      sec.querySelector(".acc-b").toggleAttribute("inert", !willOpen);
      willOpen ? open.add(idx) : open.delete(idx);
      if (willOpen) staggerIn(sec.querySelectorAll(".crit, .grp-t"));
    }

    let t;
    $q.addEventListener("input", () => {
      clearTimeout(t);
      $search.classList.toggle("has", !!$q.value);
      t = setTimeout(() => {
        const q = fold($q.value.trim());
        drawSections(q.length >= 2 ? q : "");
        const g = G(); if (g && q.length >= 2) g.from($accs.children, { opacity: 0, y: 10, duration: .3, stagger: .04, ease: "power2.out", clearProps: "transform,opacity" });
      }, 140);
    });
    $search.querySelector(".clr").addEventListener("click", () => {
      $q.value = ""; $search.classList.remove("has"); drawSections(""); $q.focus();
    });

    $app.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => {
      if ($q.value) { $q.value = ""; $search.classList.remove("has"); drawSections(""); }
      const sec = document.getElementById("sec-" + b.dataset.goto);
      if (!sec) return;
      if (!sec.classList.contains("open")) toggle(sec, true);
      sec.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
      sec.classList.add("flash"); setTimeout(() => sec.classList.remove("flash"), 900);
    }));

    $app.querySelector("[data-back]").addEventListener("click", () => {
      if (depth > 0) { depth--; history.back(); }
      else { history.replaceState(null, "", "#/equipe"); render(); }
    });

    drawSections("");
    enter(".ind, .acc");
  }

  /* ---------------- aviso de instalação ---------------- */
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; });
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let hintShown = false;

  function maybeInstallHint() {
    if (hintShown || isStandalone() || store.get(KEY_INSTALL)) return;
    hintShown = true;
    setTimeout(() => {
      const slot = document.getElementById("install-slot");
      const how = isIOS
        ? `Toque em ${I.share} <b style="display:inline;font-size:inherit">Compartilhar</b> e depois em “Adicionar à Tela de Início”.`
        : `Abra o menu do navegador e toque em “Instalar app” ou “Adicionar à tela inicial”.`;
      slot.innerHTML = `
        <div class="install" role="dialog" aria-label="Instalar aplicativo">
          <img src="icons/logo.webp" width="40" height="40" alt="">
          <div class="ci">
            <b>Coloque na tela de início</b>
            <span>${how}</span>
            ${deferredPrompt ? `<button class="ok" data-install>Instalar agora</button>` : ""}
          </div>
          <button class="x" aria-label="Fechar aviso">${I.x}</button>
        </div>`;
      const box = slot.firstElementChild;
      document.body.classList.add("hint");
      const close = () => {
        store.set(KEY_INSTALL, "1");
        document.body.classList.remove("hint");
        const g = G();
        g ? g.to(box, { opacity: 0, y: 20, duration: .2, ease: "power2.in", onComplete: () => slot.innerHTML = "" }) : slot.innerHTML = "";
      };
      box.querySelector(".x").addEventListener("click", close);
      const btn = box.querySelector("[data-install]");
      if (btn) btn.addEventListener("click", async () => {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice.catch(() => {});
        deferredPrompt = null; close();
      });
      const g = G(); if (g) g.from(box, { opacity: 0, y: 30, duration: .45, ease: "back.out(1.7)" });
    }, 1200);
  }
  window.addEventListener("appinstalled", () => { store.set(KEY_INSTALL, "1"); document.body.classList.remove("hint"); document.getElementById("install-slot").innerHTML = ""; });

  /* ---------------- start ---------------- */
  const start = () => render();
  document.readyState === "complete" ? start() : window.addEventListener("load", start);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
